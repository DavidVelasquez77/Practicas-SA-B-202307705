<text x="72" y="174" font-size="20" font-weight="700">Developer → GitHub</text><text x="72" y="202" font-size="16">PR / push a main: CI</text>
<text x="422" y="174" font-size="20" font-weight="700">Tag vX.Y.Z en main: CD</text><text x="422" y="202" font-size="16">Reutiliza CI antes de publicar</text>
<g font-size="23" font-weight="700"><text x="72" y="311">1 · BUILD</text><text x="377" y="311">2 · TEST</text><text x="712" y="311">3 · DOCKERIZACIÓN</text><text x="1047" y="311">4 · DESPLIEGUE</text></g>
<g font-size="17"><text x="72" y="344">P4: NestJS + Python</text><text x="72" y="373">P5: operations-jobs</text>
<text x="377" y="344">11 unitarias / 3 integraciones</text><text x="377" y="373">PostgreSQL + RabbitMQ reales</text>
<text x="712" y="344">6 × Dockerfile.prod</text><text x="712" y="373">GHCR público · release + SHA</text>
<text x="1047" y="344">Helm upgrade → GKE existente</text><text x="1047" y="373">Rollout, versión y health</text>
<text x="712" y="497">GitHub OIDC → GCP WIF</text><text x="712" y="526">Service Account sin llave JSON</text>
<text x="1047" y="496">P5 Helm + P6 values GKE</text><text x="1047" y="525">+ P7 overrides GHCR / tags</text><text x="1047" y="553">Propietario sube pool 0 → 1</text></g>
