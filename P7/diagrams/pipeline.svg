<text x="72" y="555" font-size="17">PR/main verdes finalizan CI; no despliegan producción.</text>
<text x="50" y="618" font-size="16" fill="#546784">El entorno Docker de pruebas vive en el runner. El despliegue de evaluación vive en GCP, namespace sa-p6.</text>
