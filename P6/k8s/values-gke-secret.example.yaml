# This file intentionally contains no credentials and is not applied.
# Run scripts/03-generate-secrets.ps1 and enter the values directly in its
# secure prompts. The resulting Kubernetes Secrets remain only in the cluster.

global:
  secrets:
    create: false
  database:
    existingSecret: comicrent-database-secret
    urlKeys:
      auth: auth-database-url
      comics: comics-database-url
      rentals: rentals-database-url
      copies: copies-database-url

