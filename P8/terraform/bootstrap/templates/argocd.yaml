apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: comicrent-p8
  namespace: argocd
spec:
  description: ComicRent P8 GitOps project
  sourceRepos:
    - {{ .Values.gitops.repoURL }}
  destinations:
    - namespace: {{ .Values.application.namespace }}
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: argoproj.io
      kind: Rollout
    - group: argoproj.io
      kind: AnalysisTemplate
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.application.name }}
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: comicrent
spec:
  project: comicrent-p8
  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    path: {{ .Values.gitops.path }}
    helm:
      valueFiles:
        - {{ .Values.gitops.valuesFile }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.application.namespace }}
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      name: comicrent-api-gateway-rollout
      namespace: {{ .Values.application.namespace }}
      jsonPointers:
        - /metadata/annotations/rollout.argoproj.io~1revision
    - group: ""
      kind: Secret
      name: comicrent-rabbitmq
      namespace: {{ .Values.application.namespace }}
      jsonPointers:
        - /data
    - group: apps
      kind: StatefulSet
      name: comicrent-rabbitmq
      namespace: {{ .Values.application.namespace }}
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
    - group: ""
      kind: Service
      name: comicrent-api-gateway-canary
      namespace: {{ .Values.application.namespace }}
      jqPathExpressions:
        - .metadata.annotations."argo-rollouts.argoproj.io/managed-by-rollouts"
        - .spec.selector."rollouts-pod-template-hash"
    - group: ""
      kind: Service
      name: comicrent-p8-api-gateway
      namespace: {{ .Values.application.namespace }}
      jqPathExpressions:
        - .metadata.annotations."argo-rollouts.argoproj.io/managed-by-rollouts"
        - .spec.selector."rollouts-pod-template-hash"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
