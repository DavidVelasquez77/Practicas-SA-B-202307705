apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: p8-require-resources
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-resources
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [sa-p8]
      validate:
        message: Every container must declare CPU and memory requests and limits.
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{`{{ element.resources.requests.cpu || '' }}`}}"
                    operator: Equals
                    value: ""
                  - key: "{{`{{ element.resources.requests.memory || '' }}`}}"
                    operator: Equals
                    value: ""
                  - key: "{{`{{ element.resources.limits.cpu || '' }}`}}"
                    operator: Equals
                    value: ""
                  - key: "{{`{{ element.resources.limits.memory || '' }}`}}"
                    operator: Equals
                    value: ""
