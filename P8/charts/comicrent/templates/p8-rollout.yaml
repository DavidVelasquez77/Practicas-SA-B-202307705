{{- if .Values.global.progressiveDelivery.apiGateway.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: comicrent-api-gateway-rollout
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/instance: comicrent
    app.kubernetes.io/part-of: comicrent
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/instance: comicrent
  strategy:
    canary:
      stableService: comicrent-p8-api-gateway
      canaryService: comicrent-api-gateway-canary
      steps:
        - setWeight: 10
        - analysis:
            templates:
              - templateName: api-gateway-smoke
        - pause:
            duration: 30s
        - setWeight: 25
        - analysis:
            templates:
              - templateName: api-gateway-smoke
        - pause:
            duration: 30s
        - setWeight: 50
        - analysis:
            templates:
              - templateName: api-gateway-smoke
        - pause:
            duration: 30s
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/instance: comicrent
        app.kubernetes.io/part-of: comicrent
    spec:
      serviceAccountName: comicrent-p8-api-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: "{{ (index .Values "api-gateway").image.repository }}:{{ (index .Values "api-gateway").image.tag }}"
          imagePullPolicy: {{ (index .Values "api-gateway").image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: comicrent-p8-api-gateway-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
{{- end }}

