apiVersion: v1
kind: LimitRange
metadata:
  name: comicrent-limits
  namespace: {{ .Values.namespace | default "sa-p5" | quote }}
  labels:
    app.kubernetes.io/part-of: "comicrent"

spec:
  limits:
    - type: Container

      defaultRequest:
        cpu: "50m"
        memory: "64Mi"

      default:
        cpu: "500m"
        memory: "512Mi"

      min:
        cpu: "10m"
        memory: "32Mi"

      max:
        cpu: "1"
        memory: "1Gi"