apiVersion: batch/v1
kind: CronJob
metadata:
  name: comicrent-cron-tick
  namespace: {{ .Values.global.namespace | quote }}
spec:
  schedule: {{ .Values.cronTick.schedule | quote }}
  timeZone: "America/Guatemala"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cron-tick
            app.kubernetes.io/part-of: comicrent
        spec:
          restartPolicy: Never

          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            fsGroup: 101
            seccompProfile:
              type: RuntimeDefault

          serviceAccountName: comicrent-cron-tick
          automountServiceAccountToken: false

          containers:
            - name: cron-tick
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}

              command:
                - python
                - cron_tick.py

              env:
{{ if .Values.database.existingSecret }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.database.existingSecret | quote }}
                      key: {{ .Values.database.urlKey | quote }}
{{ else }}
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.database.secretName }}
                      key: {{ .Values.database.passwordKey }}

                - name: DATABASE_URL
                  value: >-
                    postgresql://{{ .Values.database.username }}:$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}
{{ end }}

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL

              resources:
{{ toYaml .Values.resources | indent 16 }}
