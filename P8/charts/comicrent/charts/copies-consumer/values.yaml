replicaCount: 1

image:
  repository: comicrent/copies-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

config:
  logLevel: "info"

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 200m
    memory: 192Mi

probes:
  startup:
    failureThreshold: 30
    periodSeconds: 2
    timeoutSeconds: 3

  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 3

  liveness:
    initialDelaySeconds: 15
    periodSeconds: 15
    failureThreshold: 3
    timeoutSeconds: 3
