replicaCount: 1

image:
  repository: comicrent/comics-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3002

config:
  port: "3002"
  logLevel: "info"
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

probes:
  startup:
    failureThreshold: 30
    periodSeconds: 2

  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 3

  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

podDisruptionBudget:
  enabled: true
  minAvailable: 1