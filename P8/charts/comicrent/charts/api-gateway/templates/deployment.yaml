{{- $progressive := .Values.global.progressiveDelivery.apiGateway.enabled }}
apiVersion: {{ ternary "argoproj.io/v1alpha1" "apps/v1" $progressive }}
kind: {{ ternary "Rollout" "Deployment" $progressive }}
metadata:
  name: {{ ternary "comicrent-api-gateway-rollout" (include "api-gateway.fullname" .) $progressive }}
  namespace: {{ .Values.global.namespace | default "sa-p5" | quote }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: comicrent

spec:
  {{- if $progressive }}
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    canary:
      stableService: {{ include "api-gateway.fullname" . }}
      canaryService: comicrent-api-gateway-canary
      steps:
        - setWeight: 10
        - analysis:
            templates:
              - templateName: api-gateway-smoke
        - pause:
            duration: 30s
        - setWeight: 25
        - analysis:
            templates:
              - templateName: api-gateway-smoke
        - pause:
            duration: 30s
        - setWeight: 50
        - analysis:
            templates:
              - templateName: api-gateway-smoke
        - pause:
            duration: 30s
        - setWeight: 100
  {{- else }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}

  selector:
    matchLabels:
      {{- if $progressive }}
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/instance: comicrent
      {{- else }}
      {{- include "api-gateway.selectorLabels" . | nindent 6 }}
      {{- end }}

  template:
    metadata:
      labels:
        {{- if $progressive }}
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/instance: comicrent
        app.kubernetes.io/part-of: comicrent
        {{- else }}
        {{- include "api-gateway.selectorLabels" . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        comicrent/revision: {{ .Values.deploymentRevision | quote }}

    spec:
      serviceAccountName: {{ include "api-gateway.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "api-gateway.fullname" . }}-config
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
