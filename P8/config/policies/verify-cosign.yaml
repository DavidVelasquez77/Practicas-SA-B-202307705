apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: p8-verify-cosign
  annotations:
    policies.kyverno.io/title: Verify ComicRent images with Cosign
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/description: >-
      Only admits ComicRent images signed keylessly by the P8 release workflow
      through GitHub Actions and recorded in the Sigstore transparency log.
spec:
  validationFailureAction: Enforce
  background: false
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 30
  rules:
    - name: verify-comicrent-ghcr-images
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - sa-p8
      verifyImages:
        - imageReferences:
            - ghcr.io/davidvelasquez77/comicrent-*:* 
          failureAction: Enforce
          # Pin admitted workloads to the verified digest. ArgoCD ignores this
          # admission-time mutation below so Git remains the source of intent.
          mutateDigest: false
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subjectRegExp: 'https://github\.com/DavidVelasquez77/Practicas-SA-B-202307705/\.github/workflows/p8-release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+'
                    rekor:
                      url: https://rekor.sigstore.dev
