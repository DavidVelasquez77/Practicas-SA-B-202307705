apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: p8-require-nonroot
  annotations:
    policies.kyverno.io/title: Require non-root containers
    policies.kyverno.io/category: Pod Security
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-run-as-nonroot
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [sa-p8]
      validate:
        message: Workloads must run as non-root with privilege escalation disabled.
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
