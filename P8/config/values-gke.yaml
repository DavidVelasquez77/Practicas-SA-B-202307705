# P8 GitOps environment overrides for the ComicRent Helm chart.
namespace: sa-p8

global:
  environment: p8-gitops
  namespace: sa-p8
  progressiveDelivery:
    apiGateway:
      enabled: true
  security:
    allowInsecureImages: false
  secrets:
    create: false
  database:
    existingSecret: comicrent-database-secret
    urlKeys:
      auth: auth-database-url
      comics: comics-database-url
      rentals: rentals-database-url
      copies: copies-database-url
  networkPolicy:
    externalPostgres:
      enabled: true

postgresql:
  enabled: false

rabbitmq:
  namespaceOverride: sa-p8
  fullnameOverride: comicrent-rabbitmq
  replicaCount: 1
  clustering:
    enabled: false
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  service:
    type: ClusterIP
  auth:
    username: comicrent
    existingPasswordSecret: comicrent-rabbitmq-secret
    existingSecretPasswordKey: rabbitmq-password

api-gateway:
  replicaCount: 0
  autoscaling:
    enabled: false
  image:
    repository: ghcr.io/davidvelasquez77/comicrent-api-gateway
    tag: "v0.8.0"
    pullPolicy: Always
  service:
    type: LoadBalancer
    port: 3000
  config:
    logLevel: "info"

auth-service:
  image:
    repository: ghcr.io/davidvelasquez77/comicrent-auth-service
    tag: "v0.8.0"
    pullPolicy: Always

comics-service:
  image:
    repository: ghcr.io/davidvelasquez77/comicrent-comics-service
    tag: "v0.8.0"
    pullPolicy: Always

rentals-service:
  image:
    repository: ghcr.io/davidvelasquez77/comicrent-rentals-service
    tag: "v0.8.0"
    pullPolicy: Always

copies-service:
  image:
    repository: ghcr.io/davidvelasquez77/comicrent-copies-service
    tag: "v0.8.0"
    pullPolicy: Always

copies-consumer:
  image:
    repository: ghcr.io/davidvelasquez77/comicrent-copies-service
    tag: "v0.8.0"
    pullPolicy: Always

operations-jobs:
  global:
    namespace: sa-p8
  image:
    repository: ghcr.io/davidvelasquez77/comicrent-operations-jobs
    tag: "v0.8.0"
    pullPolicy: Always
  database:
    existingSecret: comicrent-database-secret
    urlKey: operations-database-url
  rabbitmq:
    host: comicrent-rabbitmq
    port: 5672
    username: comicrent
    secretName: comicrent-rabbitmq-secret
    passwordKey: rabbitmq-password

extraLabels:
  project: "comicrent"
  practice: "p8"
  managedByCourse: "software-avanzado"
