name: P7 CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  node:
    name: TEST / Build y unitarias / ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            path: P4/api-gateway
          - service: auth-service
            path: P4/services/auth-service
          - service: comics-service
            path: P4/services/comics-service
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
      - name: Instalar dependencias bloqueadas
        run: npm ci
      - name: Generar cliente Prisma
        if: matrix.service != 'api-gateway'
        run: npx --no-install prisma generate
      - name: Build
        run: npm run build
      - name: TEST | Ejecutar pruebas unitarias
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          if [[ "$SERVICE" == auth-service ]]; then
            npm test 2>&1 | tee unit-tests.log
          else
            npm test -- --runInBand 2>&1 | tee unit-tests.log
          fi
          echo '==================== PASS / TEST UNITARIAS ===================='
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-${{ matrix.service }}
          path: ${{ matrix.path }}/unit-tests.log
          if-no-files-found: ignore

  python:
    name: TEST / Build y unitarias / ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: rentals-service
            path: P4/services/rentals-service
            source: app
          - service: copies-service
            path: P4/services/copies-service
            source: app
          - service: operations-jobs
            path: P5/jobs
            source: .
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Build Python (compilación de módulos)
        run: python -m compileall -q ${{ matrix.source }}
      - name: TEST | Ejecutar pruebas unitarias
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee unit-tests.log
          echo '==================== PASS / TEST UNITARIAS ===================='
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-${{ matrix.service }}
          path: ${{ matrix.path }}/unit-tests.log
          if-no-files-found: ignore

  integration:
    name: TEST / Tres integraciones reales
    needs: [node, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_FILE: P4/tests/integration/compose.yaml
      COMPOSE_PROJECT_NAME: comicrent-p7-tests
    steps:
      - uses: actions/checkout@v4
      - name: Preparar imágenes de pruebas
        run: docker compose build
      - name: TEST | Rentals–Comics, Rentals–Copies y RabbitMQ
        run: |
          set -euo pipefail
          docker compose up --abort-on-container-exit --exit-code-from tests 2>&1 | tee integration-tests.log
          echo '==================== PASS / TEST INTEGRACION ===================='
      - name: Guardar diagnóstico del entorno sintético
        if: always()
        run: docker compose logs --no-color > integration-services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-tests
          path: integration-*.log
      - name: Retirar únicamente el entorno efímero de pruebas
        if: always()
        run: docker compose down --volumes --remove-orphans

  helm:
    name: TEST / Validar Helm P5 + P6 + P7
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Lint y render (dependencias versionadas en P5)
        run: |
          helm lint P5/helm/comicrent -f P6/k8s/values-gke-prod.yaml -f P7/config/values-ci-cd.yaml
          helm template comicrent P5/helm/comicrent --namespace sa-p6 -f P6/k8s/values-gke-prod.yaml -f P7/config/values-ci-cd.yaml > /tmp/p7-rendered.yaml
          test -s /tmp/p7-rendered.yaml
          echo '==================== PASS / TEST HELM ===================='
