apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "copies-consumer.fullname" . }}
  namespace: {{ .Values.global.namespace | default "sa-p5" | quote }}
  labels:
    {{- include "copies-consumer.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      {{- include "copies-consumer.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "copies-consumer.selectorLabels" . | nindent 8 }}

      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ printf "%s|%s" .Values.global.secrets.postgresUserPassword .Values.global.secrets.rabbitmqPassword | sha256sum | quote }}

    spec:
      serviceAccountName: {{ include "copies-consumer.fullname" . }}
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: copies-consumer

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          command:
            - python
            - -u
            - -m
            - app.messaging.consumer

          envFrom:
            - configMapRef:
                name: {{ include "copies-consumer.fullname" . }}-config

          env:
{{ if .Values.global.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.database.existingSecret | quote }}
                  key: {{ .Values.global.database.urlKeys.copies | quote }}
{{ else }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comicrent-postgresql-secret
                  key: password

            - name: DATABASE_URL
              value: "postgresql+psycopg://comicrent_user:$(DB_PASSWORD)@comicrent-postgresql:5432/copies_db"
{{ end }}

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comicrent-rabbitmq-secret
                  key: rabbitmq-password

          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'test -n "$DATABASE_URL" && test -n "$RABBITMQ_HOST"'
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'test -n "$DATABASE_URL" && test -n "$RABBITMQ_HOST"'
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'test -n "$DATABASE_URL" && test -n "$RABBITMQ_HOST"'
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
