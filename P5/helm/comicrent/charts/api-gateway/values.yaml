replicaCount: 1

deploymentRevision: "v2"

image:
  repository: comicrent/api-gateway
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

config:
  port: "3000"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

probes:
  startup:
    failureThreshold: 30
    periodSeconds: 2

  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 3

  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 40

podDisruptionBudget:
  enabled: true
  minAvailable: 1