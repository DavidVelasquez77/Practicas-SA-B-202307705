apiVersion: apps/v1
kind: Deployment
metadata:
  name: comicrent-summary-consumer
  namespace: {{ .Values.global.namespace | quote }}
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: summary-consumer

  template:
    metadata:
      labels:
        app.kubernetes.io/name: summary-consumer
        app.kubernetes.io/part-of: comicrent

    spec:
      serviceAccountName: comicrent-operations
      automountServiceAccountToken: false

      serviceAccountName: comicrent-summary-consumer
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: summary-consumer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command:
            - python
            - -u
            - summary_consumer.py

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.passwordKey }}

            - name: DATABASE_URL
              value: >-
                postgresql://{{ .Values.database.username }}:$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.secretName }}
                  key: {{ .Values.rabbitmq.passwordKey }}

            - name: RABBITMQ_HOST
              value: {{ .Values.rabbitmq.host | quote }}

            - name: RABBITMQ_PORT
              value: {{ .Values.rabbitmq.port | quote }}

            - name: RABBITMQ_USER
              value: {{ .Values.rabbitmq.username | quote }}

            - name: RABBITMQ_EXCHANGE
              value: {{ .Values.rabbitmq.exchange | quote }}

            - name: SUMMARY_ROUTING_KEY
              value: {{ .Values.rabbitmq.routingKey | quote }}

            - name: SUMMARY_QUEUE
              value: {{ .Values.rabbitmq.queue | quote }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
{{ toYaml .Values.resources | indent 12 }}

          startupProbe:
            exec:
              command:
                - python
                - -c
                - "import os; assert os.getenv('RABBITMQ_URL')"
            failureThreshold: {{ .Values.summaryConsumer.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.summaryConsumer.probes.startup.periodSeconds }}

          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import os; assert os.getenv('RABBITMQ_URL')"
            initialDelaySeconds: {{ .Values.summaryConsumer.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.summaryConsumer.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.summaryConsumer.probes.readiness.failureThreshold }}

          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os; assert os.getenv('DATABASE_URL')"
            initialDelaySeconds: {{ .Values.summaryConsumer.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.summaryConsumer.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.summaryConsumer.probes.liveness.failureThreshold }}