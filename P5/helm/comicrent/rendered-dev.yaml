---
# Source: comicrent/charts/rabbitmq/templates/networkpolicy.yaml
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: comicrent-rabbitmq
  namespace: "sa-p5"
  labels:
    app.kubernetes.io/instance: comicrent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/version: 3.13.5
    helm.sh/chart: rabbitmq-14.6.3
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: comicrent
      app.kubernetes.io/name: rabbitmq
  policyTypes:
    - Ingress
    - Egress
  egress:
    - {}
  ingress:
    # Allow inbound connections to RabbitMQ
    - ports:
        - port: 4369
        - port: 5672
        - port: 5671
        - port: 25672
        - port: 15672

