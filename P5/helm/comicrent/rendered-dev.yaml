spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: comicrent
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/component: primary
  policyTypes:
    - Ingress
    - Egress
  egress:
    - {}
  ingress:
    - ports:
