namespace: sa-p5

global:
  environment: base
  namespace: sa-p5

  security:
    allowInsecureImages: true

  secrets:
    postgresPassword: ""
    postgresUserPassword: ""
    rabbitmqPassword: ""
    jwtSecret: ""
    encryptionKey: ""

# ==================================================
# PostgreSQL
# ==================================================

postgresql:
  namespaceOverride: sa-p5

  fullnameOverride: comicrent-postgresql

  architecture: standalone

  auth:
    enablePostgresUser: true
    username: comicrent_user
    database: auth_db

    existingSecret: comicrent-postgresql-secret

    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password

  primary:

    service:
      type: ClusterIP
      ports:
        postgresql: 5432

    persistence:
      enabled: true
      size: 2Gi

    networkPolicy:
      enabled: false

    initdb:
      scripts:

        01-create-databases.sql: |
          CREATE DATABASE comics_db OWNER comicrent_user;
          CREATE DATABASE rentals_db OWNER comicrent_user;
          CREATE DATABASE copies_db OWNER comicrent_user;
          CREATE DATABASE operations_db OWNER comicrent_user;


# ==================================================
# RabbitMQ
# ==================================================

rabbitmq:
  namespaceOverride: sa-p5
  fullnameOverride: comicrent-rabbitmq
  replicaCount: 1

  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq
    tag: 3.13.5-debian-12-r1

  auth:
    username: comicrent
    existingPasswordSecret: comicrent-rabbitmq-secret
    existingSecretPasswordKey: rabbitmq-password

  service:
    type: ClusterIP

  persistence:
    enabled: true
    size: 1Gi

  networkPolicy:
    enabled: false

extraLabels:
  project: "comicrent"
  practice: "p5"
  managedByCourse: "software-avanzado"